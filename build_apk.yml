name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - icon-*.png
      - .github/workflows/build_apk.yml

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create the Android project
        run: |
          mkdir capapp
          cd capapp
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/local-notifications@7
          npm i -D @capacitor/assets
          mkdir www
          cp ../index.html www/index.html
          npx cap init "Kakarot Chat" com.kakarot.chat --web-dir www
          npx cap add android

      - name: Dragon Ball app icon
        working-directory: capapp
        run: |
          mkdir -p assets
          for f in icon-only icon-foreground icon-background; do
            if [ -f "../assets/$f.png" ]; then cp "../assets/$f.png" assets/
            elif [ -f "../$f.png" ]; then cp "../$f.png" assets/
            fi
          done
          if [ -f assets/icon-only.png ]; then
            npx capacitor-assets generate --android
          else
            echo "No icon files found, keeping the default icon"
          fi

      - name: Allow notifications on Android 13+
        working-directory: capapp
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS "$M" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' "$M"

      - name: Build the APK
        working-directory: capapp
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: kakarot-chat-apk
          path: capapp/android/app/build/outputs/apk/debug/app-debug.apk
