name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Capacitor and native Google authentication
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor-firebase/authentication@7

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/

      - name: Create Android project
        run: |
          npx cap init "Kakarot Chat" "com.kakarot.chat" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Configure native Firebase for Google sign-in
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            echo "Firebase Android configuration installed."
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 is not set. The APK can compile, but native Google sign-in will not work until this secret is added."
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kakarot-chat-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
