name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Capacitor and native Google authentication
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor-firebase/authentication@7

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/

      - name: Create Android project
        run: |
          npx cap init "Kakarot Chat" "com.kakarot.chat" --web-dir www
          node -e "const fs=require('fs'); const p='capacitor.config.json'; const c=JSON.parse(fs.readFileSync(p,'utf8')); c.plugins={...(c.plugins||{}),FirebaseAuthentication:{providers:['google.com'],skipNativeAuth:true}}; fs.writeFileSync(p,JSON.stringify(c,null,2));"
          npx cap add android
          node <<'NODE'
          const fs = require('fs');
          const p = 'android/variables.gradle';
          let s = fs.readFileSync(p, 'utf8');
          if (!s.includes('rgcfaIncludeGoogle')) s = s.replace(/ext\\s*\\{/, "ext {\\n    rgcfaIncludeGoogle = true\\n    androidxCredentialsVersion = '1.3.0'");
          fs.writeFileSync(p, s);
          NODE
          npx cap sync android

      - name: Configure native Firebase for Google sign-in
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            # Add Google's Gradle plugin only when the matching Android Firebase config exists.
            sed -i "/^dependencies {/a\\    classpath 'com.google.gms:google-services:4.4.2'" android/build.gradle
            printf "\\napply plugin: 'com.google.gms.google-services'\\n" >> android/app/build.gradle
            echo "Firebase Android configuration installed."
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 is not set. The APK can compile, but native Google sign-in will not work until this secret is added."
          fi

      - name: Validate JavaScript syntax
        run: |
          node --check cloud_server.js
          node --input-type=module --check < firebase.js
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const match = html.match(/<script type="module">([\\s\\S]*?)<\\/script>/);
          if (!match) throw new Error('Main module script not found in index.html');
          fs.writeFileSync('/tmp/kakarot-inline.mjs', match[1]);
          NODE
          node --check /tmp/kakarot-inline.mjs

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kakarot-chat-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
