name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Capacitor and native Google authentication
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor-firebase/authentication@7.5.0 firebase@11.10.0 esbuild@0.25.0

      - name: Prepare web files and bundle native authentication bridge
        run: |
          mkdir -p www
          cp index.html www/
          cat > native-auth-entry.js <<'EOF'
          import { FirebaseAuthentication } from '@capacitor-firebase/authentication';
          window.KCFirebaseAuthentication = FirebaseAuthentication;
          EOF
          npx esbuild native-auth-entry.js --bundle --format=esm --platform=browser --outfile=www/native-auth.js

      - name: Create Android project
        run: |
          npx cap init "Kakarot Chat" "com.kakarot.chat" --web-dir www
          node -e "const fs=require('fs'); const p='capacitor.config.json'; const c=JSON.parse(fs.readFileSync(p,'utf8')); c.plugins={...(c.plugins||{}),FirebaseAuthentication:{providers:['google.com'],skipNativeAuth:true}}; fs.writeFileSync(p,JSON.stringify(c,null,2));"
          npx cap add android
          node <<'NODE'
          const fs = require('fs');
          const p = 'android/variables.gradle';
          let s = fs.readFileSync(p, 'utf8');
          if (!s.includes('rgcfaIncludeGoogle')) s = s.replace(/ext\s*\{/, "ext {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'");
          fs.writeFileSync(p, s);
          NODE
          npx cap sync android

      - name: Configure and validate native Firebase Google sign-in
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          # Keep native sign-in validation strict; never publish an APK that cannot authenticate.
          # Try raw JSON and Base64 secrets independently; a malformed raw value must not hide a valid Base64 value.
          node <<'NODE'
          const fs = require('fs');
          const { TextDecoder } = require('util');

          const secrets = [
            ['GOOGLE_SERVICES_JSON', (process.env.GOOGLE_SERVICES_JSON || '').trim()],
            ['GOOGLE_SERVICES_JSON_BASE64', (process.env.GOOGLE_SERVICES_JSON_BASE64 || '').trim()]
          ].filter(([, value]) => value.length > 0);

          if (secrets.length === 0) {
            throw new Error('Missing GitHub Actions secret. Add the complete google-services.json as GOOGLE_SERVICES_JSON or encode the complete file once and add it as GOOGLE_SERVICES_JSON_BASE64.');
          }

          function parseSecret(input) {
            let current = input.replace(/^\uFEFF/, '').trim();
            current = current.replace(/^base64:/i, '').trim();
            current = current.replace(/^data:[^,]*;base64,/i, '').trim();
            current = current.replace(/^\x60{3}(?:json)?\s*|\s*\x60{3}$/g, '').trim();

            const decodedLengths = [];
            for (let layer = 0; layer <= 2; layer++) {
              if (current.startsWith('"') && current.endsWith('"')) {
                try {
                  const unquoted = JSON.parse(current);
                  if (typeof unquoted === 'string') current = unquoted.trim();
                } catch {}
              }

              try {
                const parsed = JSON.parse(current);
                if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
                  return { config: parsed, decodedLengths };
                }
              } catch {}

              if (layer === 2) break;
              const compact = current.replace(/\s/g, '').replace(/-/g, '+').replace(/_/g, '/');
              if (!compact || !/^[A-Za-z0-9+/]*={0,2}$/.test(compact) || compact.length % 4 === 1) break;

              const unpadded = compact.replace(/=+$/, '');
              const padded = unpadded + '='.repeat((4 - unpadded.length % 4) % 4);
              const bytes = Buffer.from(padded, 'base64');
              const canonical = bytes.toString('base64').replace(/=+$/, '');
              if (canonical !== unpadded) break;

              try {
                current = new TextDecoder('utf-8', { fatal: true }).decode(bytes).replace(/^\uFEFF/, '').trim();
                decodedLengths.push(current.length);
              } catch {
                decodedLengths.push('invalid-utf8');
                break;
              }
            }
            return { config: null, decodedLengths };
          }

          function validateFirebaseConfig(config) {
            if (config.project_info?.project_id !== 'kakarot-chat') {
              return 'wrong Firebase project; expected kakarot-chat';
            }
            const apps = Array.isArray(config.client) ? config.client : [];
            const app = apps.find(x => x.client_info?.android_client_info?.package_name === 'com.kakarot.chat');
            if (!app) return 'missing Android app package com.kakarot.chat';
            const clients = Array.isArray(app.oauth_client) ? app.oauth_client : [];
            if (!clients.some(x => x.client_type === 1)) {
              return 'missing Android OAuth client (client_type 1); register the APK signing SHA-1 in Firebase and download a fresh config';
            }
            return null;
          }

          let selectedConfig = null;
          const diagnostics = [];
          for (const [name, value] of secrets) {
            const parsed = parseSecret(value);
            if (!parsed.config) {
              const stages = parsed.decodedLengths.length ? parsed.decodedLengths.join(',') : 'none';
              diagnostics.push(name + ': input_chars=' + value.length + ', decoded_text_lengths=' + stages + ', not valid JSON/Base64');
              continue;
            }

            const problem = validateFirebaseConfig(parsed.config);
            if (problem) {
              diagnostics.push(name + ': ' + problem);
              continue;
            }

            selectedConfig = parsed.config;
            console.log('Validated Firebase project, Android package, and Android OAuth client using ' + name + '.');
            break;
          }

          if (!selectedConfig) {
            throw new Error('No supplied Firebase secret passed validation. Safe diagnostics: ' + diagnostics.join(' | ') + '. Set GOOGLE_SERVICES_JSON to the entire downloaded google-services.json contents, or set GOOGLE_SERVICES_JSON_BASE64 to the complete file encoded once with: base64 -w 0 google-services.json. Do not paste the secret into chat or logs.');
          }

          fs.writeFileSync('android/app/google-services.json', JSON.stringify(selectedConfig, null, 2));
          NODE
          # Add Google's Gradle plugin for the validated Android Firebase config.
          if ! grep -q "com.google.gms:google-services" android/build.gradle; then
            sed -i "/^[[:space:]]*dependencies[[:space:]]*{/a\\    classpath 'com.google.gms:google-services:4.4.2'" android/build.gradle
          fi
          printf "\\napply plugin: 'com.google.gms.google-services'\\n" >> android/app/build.gradle
          echo "Native Firebase Google sign-in configuration installed and validated."

      - name: Validate JavaScript syntax
        run: |
          node --check cloud_server.js
          node --input-type=module --check < firebase.js
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const match = html.match(/<script type="module">([\s\S]*?)<\/script>/);
          if (!match) throw new Error('Main module script not found in index.html');
          fs.writeFileSync('/tmp/kakarot-inline.mjs', match[1]);
          NODE
          node --check /tmp/kakarot-inline.mjs

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Print APK signing SHA-1 and SHA-256
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::Android apksigner was not found."
            exit 1
          fi
          echo "APK signing certificate fingerprints:"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kakarot-chat-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
