<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kakarot Chat</title>
<style>
:root{--bg:#070b1a;--panel:#111a3a;--line:#25315f;--orange:#ff8c1a;--ki:#3ec5ff;--tx:#eaf0ff;--mut:#8d99c4;--blue:#1b3a8a}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.screen{max-width:720px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;padding:0 12px}
#splash,#login,#fail{align-items:center;justify-content:center;text-align:center;gap:16px}
h1,.logo{font:900 italic clamp(28px,8vw,44px)/1.05 Impact,"Arial Black",sans-serif;color:var(--orange);text-shadow:3px 3px 0 var(--blue);margin:0}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;cursor:pointer}
button:disabled,input:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ki);outline-offset:2px}
.pri{background:var(--orange);border-color:var(--orange);color:#1a0d00;font-weight:700}
.plain{padding:0;border:0;background:none;border-radius:50%}
#bell{font-size:22px}
header{display:flex;align-items:center;gap:10px;padding:12px 0}
header>b{flex:1;font-size:18px}
input{width:100%;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;padding:12px 4px}
.row>div,#who>div{min-width:0}
small{display:block;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:40px;height:40px;border-radius:50%;background:var(--blue);display:grid;place-items:center;object-fit:cover;flex:none;font-weight:700}
.empty{color:var(--mut);padding:16px 4px;margin:0}
#list{flex:1;overflow:auto}
#results{overflow:auto;max-height:40%}
#who{flex:1;display:flex;gap:10px;align-items:center;min-width:0}
#msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:8px 0}
.b{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--panel);align-self:flex-start;overflow-wrap:anywhere;cursor:pointer}
.b.me{align-self:flex-end;background:var(--blue)}
.b small{font-size:11px;text-align:right}
.rd{color:var(--ki);font-style:normal}
.del{display:none;margin-top:6px;padding:4px 10px}
.sel .del{display:inline-block}
#composer{display:flex;gap:8px;padding:10px 0 14px}
.menu{position:relative}
.menu summary{cursor:pointer;padding:8px 12px;list-style:none}
.menu>div{position:absolute;right:0;top:100%;z-index:2;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;display:grid;gap:4px;min-width:150px}
#err{color:#ff8a8a;margin:0}
#card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px 0}
#card .av{width:96px;height:96px;font-size:40px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--orange);padding:10px 16px;border-radius:10px;max-width:90vw}
#why{color:#ff8a8a;margin:0;font-size:14px;overflow-wrap:anywhere}
</style>
</head>
<body>
<main id="splash" class="screen"><div class="logo">Kakarot Chat</div><small id="slow" hidden>Connecting…</small></main>

<main id="login" class="screen" hidden>
  <h1>Welcome to Kakarot Chat</h1>
  <button id="go" class="pri">Continue with Google</button>
  <p id="err" role="alert" hidden></p>
  <button id="retry" hidden>Retry</button>
</main>

<main id="fail" class="screen" hidden>
  <h1>Kakarot Chat</h1>
  <p id="failMsg" role="alert">Kakarot Chat could not connect. Please check your internet connection and try again.</p>
  <p id="why" role="alert" hidden></p>
  <button id="fretry" class="pri">Retry</button>
</main>

<main id="home" class="screen" hidden>
  <header><b>Kakarot Chat</b><button id="bell" class="plain" aria-label="Turn on notifications" hidden>🔔</button><button id="me" class="plain" aria-label="Your profile"></button></header>
  <input id="q" type="search" placeholder="Search by username or full email" autocomplete="off">
  <div id="results"></div>
  <div id="list"></div>
</main>

<main id="chat" class="screen" hidden>
  <header>
    <button id="back" aria-label="Back to chats">←</button>
    <div id="who"></div>
    <details id="menu" class="menu"><summary aria-label="More">⋮</summary>
      <div><button id="blk">Block user</button><button id="rep">Report user</button></div>
    </details>
  </header>
  <div id="msgs"></div>
  <form id="composer"><input id="text" placeholder="Type a message" autocomplete="off" maxlength="4000"><button id="sendBtn" class="pri">Send</button></form>
</main>

<main id="profile" class="screen" hidden>
  <header><button id="pback" aria-label="Back to chats">←</button><b>Profile</b></header>
  <div id="card"></div>
  <button id="out">Log out</button>
</main>

<div id="toast" role="status" hidden></div>

<script>
/* Safety net: if the app script cannot start - usually because Firebase could not be downloaded from Google's
   official CDN (www.gstatic.com) - never leave the user on the splash screen: show a clear on-screen error. */
(function () {
  // Claude's preview (like other sandboxes) only allows a short list of script hosts, so Firebase can never load there.
  function noFirebase() {
    if (/(^|\.)(claudeusercontent\.com|claude\.ai)$/.test(location.hostname))
      return "This page is open inside Claude's preview, which blocks Firebase (www.gstatic.com), so it cannot work here. Upload index.html to a real website (for example GitHub Pages) and open that address in Chrome.";
    return "Firebase (v10.14.1) did not load from www.gstatic.com. Check your internet connection and any firewall or ad-blocker. If this page is inside a preview window, it cannot work there: put index.html on a real website address and open that in Chrome. Then tap Retry.";
  }
  function fail(why) {
    var s = document.getElementById("splash");
    if (window.__kc || !s || s.hidden) return;
    s.hidden = true;
    var w = document.getElementById("why");
    w.textContent = why;
    w.hidden = false;
    document.getElementById("fail").hidden = false;
    document.getElementById("fretry").onclick = function () { location.reload(); };
  }
  // A module script whose imports cannot be downloaded fires an error event straight away (caught here in the capture phase).
  addEventListener("error", function (e) { if (e.target && e.target.tagName === "SCRIPT") fail(noFirebase()); }, true);
  setTimeout(function () { var sl = document.getElementById("slow"); if (!window.__kc && sl) sl.hidden = false; }, 2000);
  setTimeout(function () { fail(noFirebase()); }, 7000);
})();
</script>
<script type="module">
/* Firebase loads ONLY from Google's official CDN (www.gstatic.com), as native ES modules.
   All three imports must use the exact same version number - if you ever change it, change all three together. */
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithCredential, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc, collection, query, where, orderBy, startAt, endAt, limit, onSnapshot, getDocs, serverTimestamp, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

window.__kc = 1; // tells the safety net above that the app script started (so Firebase was downloaded)

/* ---------- Firebase: configured and started once, right here ---------- */
// This web config is the app's public client configuration, not a secret: real protection comes from
// Firestore Security Rules and App Check. Never put an Admin SDK / service-account key in the app.
const firebaseConfig = {
  apiKey: "AIzaSyAFwdmFRWWCGoej3IvEY17v_WhhaOkwtNE",
  authDomain: "kakarot-chat.firebaseapp.com",
  projectId: "kakarot-chat",
  storageBucket: "kakarot-chat.firebasestorage.app",
  messagingSenderId: "948236334962",
  appId: "1:948236334962:web:c08f4dd1465074a09a8feb"
};

let app, auth, db, provider;
function initFirebase() { // ONE app; Auth and Firestore are both created from that same app
  app = getApps().length ? getApp() : initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);
  provider = new GoogleAuthProvider();
}

const $ = (s) => document.querySelector(s);
const show = (id) => document.querySelectorAll(".screen").forEach((s) => (s.hidden = s.id !== id));
const h = (tag, a = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(a)) k.startsWith("on") ? e.addEventListener(k.slice(2), v) : e.setAttribute(k, v);
  e.append(...kids.filter(Boolean));
  return e;
};
const sha = async (s) => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)))].map((b) => b.toString(16).padStart(2, "0")).join("");
const cid = (a, b) => [a, b].sort().join("_");
const ms = (t) => (t && t.toMillis ? t.toMillis() : 0);
const clock = (t) => new Date(ms(t)).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const toast = (t) => { const e = $("#toast"); e.textContent = t; e.hidden = false; clearTimeout(e.t); e.t = setTimeout(() => (e.hidden = true), 4000); };
const avatar = (p) => p.profile_photo ? h("img", { class: "av", src: p.profile_photo, alt: "", referrerpolicy: "no-referrer" }) : h("div", { class: "av" }, (p.username || "?")[0].toUpperCase());
const row = (p, sub, fn) => h("button", { class: "row", onclick: fn }, avatar(p), h("div", {}, h("div", {}, p.username), h("small", {}, sub)));

let me = null, unsubs = [], beat = 0, cur = null;
const cache = {};

/* ---------- Login ---------- */
async function login() {
  $("#err").hidden = $("#retry").hidden = true;
  try {
    const cap = window.Capacitor;
    const native = !!(cap && cap.isNativePlatform && cap.isNativePlatform());
    const nativeGoogle = native && cap.isPluginAvailable("FirebaseAuthentication") && cap.Plugins.FirebaseAuthentication;
    if (native && !nativeGoogle) throw { code: "app/missing-google-plugin" }; // inside the app, Google sign-in cannot finish without the native plugin
    if (nativeGoogle) { // Google blocks sign-in popups inside Android/iOS WebViews, so the app uses the native Google dialog
      const r = await nativeGoogle.signInWithGoogle({ skipNativeAuth: true });
      await signInWithCredential(auth, GoogleAuthProvider.credential(r.credential.idToken));
    } else {
      await signInWithPopup(auth, provider); // first thing the tap does, or browsers block the popup
    }
    // onAuthStateChanged (see boot) calls onUser, which opens the home screen
  } catch (e) {
    const msgs = {
      "app/missing-google-plugin": "This app build has no native Google sign-in. Add the @capacitor-firebase/authentication plugin, run npx cap sync, and rebuild the app.",
      "auth/popup-blocked": "Popup blocked. Please allow popups for Kakarot Chat and try again.",
      "auth/operation-not-supported-in-this-environment": "Google sign-in does not work on a page opened as a local file (file://). Open Kakarot Chat from http://localhost or from your website address instead.",
      "auth/unauthorized-domain": "This web address (" + location.hostname + ") is not authorized for sign-in yet. Add it in Firebase Console > Authentication > Settings > Authorized domains."
    };
    console.error("Sign-in failed:", e);
    $("#err").textContent = msgs[e && e.code] || "Google sign-in failed (" + String((e && (e.code || e.message)) || e).slice(0, 90) + "). Please try again.";
    $("#err").hidden = $("#retry").hidden = false;
  }
}
$("#go").onclick = $("#retry").onclick = login;

// Runs on every app open (and on login/logout): restores the saved Firebase session, or shows the login screen.
async function onUser(u) {
  unsubs.forEach((f) => f()); unsubs = []; clearInterval(beat); closeChat();
  if (!u) { me = null; return show("login"); }
  me = { uid: u.uid, email: u.email || "", username: u.displayName || (u.email || "user").split("@")[0], profile_photo: u.photoURL || "" };
  $("#me").replaceChildren(avatar(me));
  show("home");
  try { await ensureProfile(u); } catch { toast("Could not load your profile. Please try again."); }
  if (!me || me.uid !== u.uid) return;
  presence("online");
  beat = setInterval(() => presence("online"), 60000);
  watchChats();
  enablePush(false);
}

async function ensureProfile(u) {
  const uref = doc(db, "users", u.uid), now = serverTimestamp();
  const base = { user_id: u.uid, username: me.username, profile_photo: me.profile_photo };
  if ((await getDoc(uref)).exists()) await updateDoc(uref, { last_active_at: now, status: "online" });
  else await setDoc(uref, { ...base, google_id: u.providerData[0]?.uid || u.uid, email: me.email.toLowerCase(), created_at: now, last_active_at: now, status: "online" });
  await setDoc(doc(db, "profiles", u.uid), { ...base, username_lower: me.username.toLowerCase(), email_hash: await sha(me.email.toLowerCase()), status: "online", last_active_at: now }, { merge: true });
}

function presence(status) {
  if (!me || !db) return;
  const d = { status, last_active_at: serverTimestamp() };
  return Promise.all([updateDoc(doc(db, "users", me.uid), d), updateDoc(doc(db, "profiles", me.uid), d)]).catch(() => {});
}
document.addEventListener("visibilitychange", () => presence(document.hidden ? "offline" : "online"));
addEventListener("pagehide", () => presence("offline"));

/* ---------- Home: chat list + search ---------- */
async function profile(uid) {
  if (!cache[uid]) {
    const s = await getDoc(doc(db, "profiles", uid));
    cache[uid] = s.exists() ? s.data() : { user_id: uid, username: "Unknown user", profile_photo: "" };
  }
  return cache[uid];
}

function watchChats() {
  unsubs.push(onSnapshot(query(collection(db, "chats"), where("participants", "array-contains", me.uid)), async (s) => {
    const cs = s.docs.map((d) => d.data({ serverTimestamps: "estimate" })).sort((a, b) => ms(b.last_message_at) - ms(a.last_message_at));
    const ps = await Promise.all(cs.map((c) => profile(c.participants.find((x) => x !== me.uid))));
    $("#list").replaceChildren(...(cs.length
      ? cs.map((c, i) => row(ps[i], c.last_message_text || "", () => openChat(ps[i])))
      : [h("p", { class: "empty" }, "No chats yet. Search for a friend by username or full email to start one.")]));
  }));
}

let t0;
$("#q").addEventListener("input", () => { clearTimeout(t0); t0 = setTimeout(search, 300); });
async function search() {
  const t = $("#q").value.trim().toLowerCase(), box = $("#results");
  if (t.length < 2) return box.replaceChildren();
  try {
    const col = collection(db, "profiles");
    const q = t.includes("@")
      ? query(col, where("email_hash", "==", await sha(t)))
      : query(col, orderBy("username_lower"), startAt(t), endAt(t + "\uf8ff"), limit(10));
    const found = (await getDocs(q)).docs.map((d) => d.data()).filter((p) => p.user_id !== me.uid);
    box.replaceChildren(...(found.length
      ? found.map((p) => row(p, "Start chat", () => { $("#q").value = ""; box.replaceChildren(); openChat(p); }))
      : [h("p", { class: "empty" }, "No one found.")]));
  } catch { toast("Search failed. Please try again."); }
}

$("#me").onclick = () => {
  $("#card").replaceChildren(avatar(me), h("strong", {}, me.username), h("small", {}, me.email));
  show("profile");
};
$("#pback").onclick = () => show("home");
$("#out").onclick = async () => { await presence("offline"); await dropPush(); await signOut(auth); };

/* ---------- Chat ---------- */
function closeChat() { if (cur) cur.subs.forEach((f) => f()); cur = null; }

async function openChat(p) {
  closeChat();
  const chat_id = cid(me.uid, p.user_id);
  const c = (cur = { chat_id, p, exists: false, blocked: false, listening: false, subs: [] });
  $("#who").replaceChildren(avatar(p), h("div", {}, h("strong", {}, p.username), h("small", { id: "st" })));
  $("#msgs").replaceChildren();
  $("#menu").open = false;
  show("chat");
  try {
    const [cs, bs] = await Promise.all([getDoc(doc(db, "chats", chat_id)), getDoc(doc(db, "users", me.uid, "blocked", p.user_id))]);
    if (cur !== c) return;
    c.exists = cs.exists();
    setBlocked(bs.exists());
    c.subs.push(onSnapshot(doc(db, "profiles", p.user_id), (s) => {
      const d = s.data();
      if (d && $("#st")) $("#st").textContent = d.status === "online" && Date.now() - ms(d.last_active_at) < 150000 ? "Online" : "Offline";
    }));
    if (c.exists) listen(c); // rules need the chat doc to exist before messages can be read
  } catch { toast("Could not open this chat. Please try again."); }
}

function listen(c) {
  if (c.listening) return;
  c.listening = true;
  c.subs.push(onSnapshot(query(collection(db, "messages"), where("chat_id", "==", c.chat_id)), (s) => renderMsgs(s, c)));
}

function renderMsgs(s, c) {
  if (cur !== c) return;
  const box = $("#msgs"), atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  const list = s.docs.map((d) => ({ ref: d.ref, ...d.data({ serverTimestamps: "estimate" }) }))
    .filter((m) => !(m.deleted_for || []).includes(me.uid))
    .sort((a, b) => ms(a.sent_at) - ms(b.sent_at));
  box.replaceChildren(...list.map(bubble));
  if (atEnd) box.scrollTop = box.scrollHeight;
  if (!document.hidden) list.filter((m) => m.receiver_id === me.uid && !m.read_at)
    .forEach((m) => updateDoc(m.ref, { delivered_at: m.delivered_at || serverTimestamp(), read_at: serverTimestamp() }).catch(() => {}));
}

function bubble(m) {
  const mine = m.sender_id === me.uid;
  return h("div", { class: "b " + (mine ? "me" : "them"), onclick: (e) => e.currentTarget.classList.toggle("sel") },
    h("span", {}, m.text),
    h("small", {}, clock(m.sent_at), mine ? h("i", { class: m.read_at ? "rd" : "" }, m.read_at || m.delivered_at ? " ✓✓" : " ✓") : null),
    h("button", { class: "del", onclick: (e) => { e.stopPropagation(); updateDoc(m.ref, { deleted_for: arrayUnion(me.uid) }).catch(() => toast("Could not delete. Please try again.")); } }, "Delete for me"));
}

$("#composer").addEventListener("submit", async (e) => {
  e.preventDefault();
  const c = cur, inp = $("#text"), text = inp.value.trim();
  if (!c || !text || c.blocked) return;
  inp.value = "";
  const now = serverTimestamp(), meta = { last_message_at: now, last_message_text: text.slice(0, 200) };
  try {
    const chatRef = doc(db, "chats", c.chat_id), fresh = !c.exists;
    if (fresh) {
      await setDoc(chatRef, { chat_id: c.chat_id, participants: [me.uid, c.p.user_id].sort(), created_at: now, ...meta });
      c.exists = true;
      listen(c);
    }
    const ref = doc(collection(db, "messages"));
    await setDoc(ref, { message_id: ref.id, chat_id: c.chat_id, sender_id: me.uid, receiver_id: c.p.user_id, text, attachment_url: "", sent_at: now, delivered_at: null, read_at: null, deleted_for: [] });
    if (!fresh) await updateDoc(chatRef, meta);
  } catch { inp.value = text; toast("Message not sent. Check your connection and try again."); }
});

$("#back").onclick = () => { closeChat(); show("home"); };

function setBlocked(b) {
  cur.blocked = b;
  $("#text").disabled = $("#sendBtn").disabled = b;
  $("#text").placeholder = b ? "You blocked this user" : "Type a message";
  $("#blk").textContent = b ? "Unblock user" : "Block user";
}
$("#blk").onclick = async () => {
  $("#menu").open = false;
  const r = doc(db, "users", me.uid, "blocked", cur.p.user_id);
  try { cur.blocked ? await deleteDoc(r) : await setDoc(r, { blocked_at: serverTimestamp() }); setBlocked(!cur.blocked); }
  catch { toast("Could not update block. Please try again."); }
};
$("#rep").onclick = async () => {
  $("#menu").open = false;
  const reason = prompt("Why are you reporting this user?");
  if (!reason) return;
  try {
    await addDoc(collection(db, "reports"), { reporter_id: me.uid, reported_id: cur.p.user_id, chat_id: cur.chat_id, reason: reason.slice(0, 500), created_at: serverTimestamp() });
    toast("Report sent.");
  } catch { toast("Report failed. Please try again."); }
};

/* ---------- Push notifications (Firebase Cloud Messaging) ---------- */
const VAPID_KEY = "BAT67DHf8HEI_1YgrCAvTt_jfvX7hgAeU_7Mqs-nfAaVaNqRrDlzJHFTjVsxL0Cbx6i520fifcDV92PURMJJgEE"; // public Web Push key, safe in the page
const isNative = () => !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
let pushToken = "";
// ask=false: only refresh this device's token if permission was already given. ask=true: the bell was tapped, so ask for permission.
async function enablePush(ask) {
  const bell = $("#bell");
  try {
    if (isNative()) {
      const P = window.Capacitor.isPluginAvailable("PushNotifications") && window.Capacitor.Plugins.PushNotifications;
      if (!P) return;
      let ok = (await P.checkPermissions()).receive === "granted";
      if (!ok && ask) ok = (await P.requestPermissions()).receive === "granted";
      if (ok) pushToken = await new Promise((res, rej) => { P.addListener("registration", (t) => res(t.value)); P.addListener("registrationError", rej); P.register(); });
    } else if ("Notification" in window && "serviceWorker" in navigator) {
      let ok = Notification.permission === "granted";
      if (!ok && ask) ok = (await Notification.requestPermission()) === "granted";
      if (ok) {
        const { getMessaging, getToken } = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging.js");
        const reg = await navigator.serviceWorker.register("firebase-messaging-sw.js"); // must sit next to index.html
        await navigator.serviceWorker.ready;
        pushToken = await getToken(getMessaging(app), { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
      }
    } else return;
    if (pushToken && me) await updateDoc(doc(db, "users", me.uid), { fcm_tokens: arrayUnion(pushToken) });
    bell.hidden = !!pushToken;
    if (ask) toast(pushToken ? "Notifications are on." : "Notifications are blocked. Allow them in your browser or phone settings.");
  } catch (e) {
    console.error("Push setup failed:", e);
    bell.hidden = false;
    if (ask) toast("Could not turn on notifications.");
  }
}
async function dropPush() { // on logout, so this device stops getting the old account's messages
  if (pushToken && me) await updateDoc(doc(db, "users", me.uid), { fcm_tokens: arrayRemove(pushToken) }).catch(() => {});
  pushToken = "";
}
$("#bell").onclick = () => enablePush(true);

/* ---------- Startup: splash max 2s, 5s timeout, never stuck ---------- */
const failDefault = $("#failMsg").textContent;
const fail = (why, head) => {
  console.error("Kakarot Chat startup problem:", why);
  $("#failMsg").textContent = head || failDefault;
  const w = $("#why");
  w.textContent = why || "";
  w.hidden = !why;
  show("fail");
};
$("#fretry").onclick = () => location.reload();
function boot() {
  // Firebase sign-in needs a web address. A page opened from storage (file:// or content://) can never sign in.
  const webPage = /^(https?|chrome-extension):$/.test(location.protocol);
  const nativeApp = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  if (!webPage && !nativeApp) {
    $("#fretry").hidden = true;
    return fail("Google sign-in only works on a web address, not on a file opened from your phone's storage (" + location.protocol + "//). Upload index.html to a website, for example GitHub Pages, and open that address in Chrome.", "Kakarot Chat can't run as a local file.");
  }
  const slow = setTimeout(() => ($("#slow").hidden = false), 2000);
  const dead = setTimeout(() => fail("Timed out after 5 seconds while connecting to Firebase."), 5000);
  const done = () => { clearTimeout(slow); clearTimeout(dead); };
  try {
    initFirebase();
    onAuthStateChanged(auth, (u) => { done(); onUser(u).catch((e) => console.error("Kakarot Chat error:", e)); }, (e) => { done(); fail("Firebase sign-in service error: " + ((e && e.message) || e)); });
  } catch (e) { done(); fail("Firebase failed to start: " + ((e && e.message) || e)); }
}
boot();
</script>
</body>
